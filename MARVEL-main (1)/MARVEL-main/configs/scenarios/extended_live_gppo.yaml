scenario:
  name: extended_live_gppo
  description: >-
    Live-GPPO activation-state benchmark. Same extended 1.0 m geometry, same
    gppo task_scheduler with the frozen Phase14-v9 checkpoint, same real
    MARVEL PolicyNet, and the same target_search / relay / safety task set.
    The only difference from extended_gppo_scalability.yaml is the map
    extent: an 80x80 crop of maps_test/1.png padded with 4 occupied cells on every side (MARVEL's is_frontier asserts a 2-cell border) so that real
    exploration reaches the frozen Search activation threshold
    (exploration_rate >= 0.3) inside a feasible run. Nothing else is
    changed -- not the threshold, not search_service_steps, not Search
    capacity, not Relay or Safety semantics, not the geometry mode.
  version: "1.0"
  duration:
    # prepare_gppo_config rewrites this to mission_steps * interval.
    max_steps: 128
    step_dt: 0.1
environment:
  # Explicit: 'extended' is the 500 m / 1.0 m scalability environment.
  geometry_mode: extended
  map_size: [80, 80]
  map_resolution: 1.0
  map_file: assets/extended_live_gppo.png
  circular_obstacles: []
robots:
  - id_range: [0, 3]
    type: explorer
    team_id: 1
    config:
      fov: 120
      sensor_range: 10
      velocity: 1.0
      yaw_rate: 35
      initial_positions: random_safe
tasks:
  - task_id: T1_exploration
    type: exploration
    priority: 3
    assigned_robot_types: [explorer]
    params:
      target_coverage: 0.8
  - task_id: T2_target_search
    type: target_search
    priority: 5
    assigned_robot_types: [explorer]
    # Frozen maybe_activate() has no independent time gate.
    activation:
      condition: exploration_rate >= 0.3
    params: {}
  - task_id: T3_relay
    type: relay
    priority: 2
    assigned_robot_types: [explorer]
    # Protocol constants (comm_range, min_connectivity, max_relay, release
    # threshold, base) are owned by the frozen GPPO profile and injected by
    # prepare_gppo_config(); the task schema only declares the task itself.
    params: {}
dynamics:
  config_file: ../dynamics/kinematic_simple.yaml
sensor:
  config_file: ../sensors/ideal.yaml
communication:
  config_file: ../communication/ideal.yaml
evaluation:
  metrics:
    - {name: exploration_rate, weight: 0.7, target: 0.8}
    - {name: collision_count, weight: 0.3, target: 0, penalty_per_collision: -1}
