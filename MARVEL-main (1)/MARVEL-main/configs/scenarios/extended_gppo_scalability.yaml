scenario:
  name: extended_gppo_scalability
  description: >-
    Extended-geometry GPPO scalability benchmark. Unlike
    baseline_maps_test.yaml this scenario activates the real GPPO path: a
    gppo task_scheduler with the frozen Phase14-v9 checkpoint, the real
    MARVEL PolicyNet for low-level waypoints, and the same target_search /
    relay / safety task set the integration uses in marvel_native. The
    occupancy lattice is the extended 1.0 m frame. The map is a 150x150
    crop of maps_test/1.png (51% free, high structure) rather than the full
    500 m sheet: at the full extent the frozen Search activation threshold
    (exploration_rate >= 0.3) is not reachable inside a feasible benchmark
    runtime, and lowering the threshold would change task semantics. The
    crop changes only the map extent, not the geometry mode, the planner,
    the allocator, or any threshold.
  version: "1.0"
  duration:
    # prepare_gppo_config rewrites this to mission_steps * interval.
    max_steps: 128
    step_dt: 0.1
environment:
  # Explicit: 'extended' is the 500 m / 1.0 m scalability environment.
  geometry_mode: extended
  map_size: [60, 60]
  map_resolution: 1.0
  map_file: assets/extended_gppo_small.png
  circular_obstacles: []
robots:
  - id_range: [0, 3]
    type: explorer
    team_id: 1
    config:
      fov: 120
      sensor_range: 10
      velocity: 1.0
      yaw_rate: 35
      initial_positions: random_safe
tasks:
  - task_id: T1_exploration
    type: exploration
    priority: 3
    assigned_robot_types: [explorer]
    params:
      target_coverage: 0.8
  - task_id: T2_target_search
    type: target_search
    priority: 5
    assigned_robot_types: [explorer]
    # Frozen maybe_activate() has no independent time gate.
    activation:
      condition: exploration_rate >= 0.3
    params: {}
  - task_id: T3_relay
    type: relay
    priority: 2
    assigned_robot_types: [explorer]
    # Protocol constants (comm_range, min_connectivity, max_relay, release
    # threshold, base) are owned by the frozen GPPO profile and injected by
    # prepare_gppo_config(); the task schema only declares the task itself.
    params: {}
dynamics:
  config_file: ../dynamics/kinematic_simple.yaml
sensor:
  config_file: ../sensors/ideal.yaml
communication:
  config_file: ../communication/ideal.yaml
evaluation:
  metrics:
    - {name: exploration_rate, weight: 0.7, target: 0.8}
    - {name: collision_count, weight: 0.3, target: 0, penalty_per_collision: -1}
