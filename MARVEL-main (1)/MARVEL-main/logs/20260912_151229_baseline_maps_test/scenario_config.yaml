scenario:
  name: baseline_maps_test
  description: MARVEL baseline using real maps_test map (1.png), 4 robots, 128 steps
  version: "1.0"
  duration:
    max_steps: 128
    step_dt: 0.1
environment:
  map_size: [500, 500]
  map_resolution: 1.0
  circular_obstacles: []
  map_file: ../../maps_test/1.png
robots:
  - id_range: [0, 3]
    type: explorer
    team_id: 1
    config:
      fov: 120
      sensor_range: 10
      velocity: 1.0
      yaw_rate: 35
      initial_positions: random_safe
tasks:
  - task_id: T1_exploration
    type: exploration
    priority: 3
    assigned_robot_types: [explorer]
    params:
      target_coverage: 0.8
dynamics:
  config_file: ../dynamics/kinematic_simple.yaml
sensor:
  config_file: ../sensors/ideal.yaml
communication:
  config_file: ../communication/ideal.yaml
evaluation:
  metrics:
    - {name: exploration_rate, weight: 0.7, target: 0.8}
    - {name: collision_count, weight: 0.3, target: 0, penalty_per_collision: -1}
